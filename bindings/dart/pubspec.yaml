name: ldk_node
description: Dart bindings for ldk-node, a self-custodial Lightning Network node library.
version: 0.1.0
repository: https://github.com/lightningdevkit/ldk-node

environment:
  sdk: "^3.10.0"

dependencies:
  ffi: ^2.1.4
  native_toolchain_rust: ^1.0.3
  hooks: ^1.0.0

dev_dependencies:
  test: ^1.26.2

native:
  rules:
    - include: "**/*.dart"

hooks:
  build: hook/build.dart
